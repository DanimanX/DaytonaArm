# Automatically builds and verifies the ROM-free AArch64 / OpenGL ES 2.0
# PortMaster package for DaytonaArm (Anbernic RG34XX / Allwinner H700 and
# compatible ARM64 Linux handhelds), verifies dynamic .so ABI symbol export
# using a synthetic ROM-free mock module, and publishes GitHub Releases on tags.
#
# Zero copyrighted ROMs or ROM-derived game code ever enter the build or artifacts.
name: Build ARM64 PortMaster

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_cpu:
        description: 'Target ARM64 CPU (cortex_a53 for RG34XX/H700, cortex_a55 for RK3566, generic)'
        required: false
        default: 'cortex_a53'

permissions:
  contents: write

jobs:
  build-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update -q
          sudo apt-get -o Acquire::Retries=3 install -qy --no-install-recommends \
            build-essential python3 curl git tar xz-utils zip file binutils

      - name: Cache cross-compile dependencies (Zig, SDL2 headers, SoftFloat, ymfm, ImGui)
        uses: actions/cache@v4
        with:
          path: |
            deps
            extern
            !deps/zig-cache
          key: daytonaarm-deps-${{ hashFiles('tools/build-arm64.sh') }}

      - name: Cross-compile AArch64 runtime and assemble PortMaster package
        env:
          TARGET_CPU: ${{ github.event.inputs.target_cpu || 'cortex_a53' }}
        run: |
          chmod +x tools/build-arm64.sh tools/build-arm64-cache.sh portmaster/*.sh
          tools/build-arm64.sh
          (cd dist && sha256sum DaytonaArm-PortMaster-aarch64.zip > DaytonaArm-PortMaster-aarch64.zip.sha256)
          ls -lh dist/

      - name: Verify AArch64 dynamic .so ABI and runtime symbol exports (ROM-free mock)
        run: |
          cat > build-arm64/ci_mock_mod.cpp <<'EOF'
          #define M2_ROMSET "daytona"
          #include "module_abi.h"
          namespace gen {
          bool has_code(uint32_t) { return false; }
          void run(Env &e) { e.c.do_ret(); (void)e.ls.check(0); }
          uint64_t native_instructions() { return 0; }
          }
          namespace rt::tgpgen {
          const uint32_t program_crc32 = 0xD6D611DDu;
          const uint32_t program_words = 2024u;
          void run(Tgp &t, uint64_t) { (void)t.io_r(0); }
          }
          namespace sndgen {
          bool has_code(uint32_t) { return false; }
          void run(Env &e) { e.c.w16(0, 0); }
          uint64_t native_instructions() { return 0; }
          }
          #include "module_export.cpp"
          EOF
          deps/zig-linux/zig c++ -target aarch64-linux-gnu.2.28 -mcpu=cortex_a53 \
            -std=c++20 -O2 -fPIC -fno-fast-math -ffp-contract=off \
            -Iplatform/arm64/src -Iplatform/arm64 -Isrc -Iextern/softfloat/source/include \
            -DSOFTFLOAT_FAST_INT64 -DLITTLEENDIAN=1 -DTHREAD_LOCAL=__thread -DM2_DYNAMIC_ROMSET=1 \
            -DM2_FAST_GEN=1 -DM2_FAST_BUS=1 -DM2_FAST_TGP=1 -DM2_FAST_CPU=1 -DM2_FAST_GEO=1 -DM2_VITA_RENDER_OPT=1 \
            -shared -Wl,-Bsymbolic -Wl,--version-script=platform/arm64/module_export.ver -Wl,--allow-shlib-undefined \
            build-arm64/ci_mock_mod.cpp -o build-arm64/ci_mock_mod.so
          SO_INFO=$(file build-arm64/ci_mock_mod.so)
          echo "$SO_INFO" | grep -q "ARM aarch64"
          SO_SYMS=$(nm -D --defined-only build-arm64/ci_mock_mod.so)
          printf '%s\n' "$SO_SYMS" | grep -q "daytona_module_api_v1"
          echo "Mock AArch64 .so ABI & export verification PASSED"

      - name: Upload PortMaster artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaytonaArm-PortMaster-aarch64
          path: |
            dist/DaytonaArm-PortMaster-aarch64.zip
            dist/DaytonaArm-PortMaster-aarch64.zip.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          FILES="dist/DaytonaArm-PortMaster-aarch64.zip dist/DaytonaArm-PortMaster-aarch64.zip.sha256"
          cat > dist/release-notes.md <<'EOF'
          Automated ROM-free AArch64 / OpenGL ES 2.0 / NEON PortMaster build of **DaytonaArm** tuned for Anbernic RG34XX (Allwinner H700) and compatible ARM64 Linux handhelds.

          ### Contents (Zero ROMs / Zero Game Code)
          - `Daytona USA.sh`, `Daytona USA 93.sh`, `Daytona USA Rev A.sh` (PortMaster launchers with `performance` CPU governor)
          - `daytonaarm/daytona.aarch64` (ARM64 Cortex-A53, 4-core pipeline, OpenGL ES 2.0, ARM64 NEON, max `GLIBC_2.17`)
          - `daytonaarm/gamecontrollerdb.txt` (includes Anbernic RG34XX mapping), PortMaster metadata, and licences

          ### Quick Setup (BYOD)
          1. Extract `DaytonaArm-PortMaster-aarch64.zip` into your handheld's `ports/` folder.
          2. Copy your own legal MAME `daytona.zip` (Revision A, 1994) and/or `daytona93.zip` (Deluxe '93) into `ports/daytonaarm/roms/`.
          3. Pre-build the `-O2` Cortex-A53 `.so` cache module(s) on your PC with `tools/build-arm64-cache.sh` and copy `cache/daytona*-aarch64.so` into `ports/daytonaarm/cache/`.
          EOF
          sed -i 's/^          //' dist/release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES \
              --title "DaytonaArm $TAG (ARM64 / Anbernic RG34XX PortMaster)" \
              --notes-file dist/release-notes.md
          fi
